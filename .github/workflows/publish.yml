name: Publish Package

# This plugin is distributed from this Git repository, not from npm. The
# community catalog, the official plugin market and the local market all
# install it by its repository URL, and every one of them reads that URL from
# the catalog entry rather than from the registry.
#
# The workflow is kept because the scope @woaicarlos is reserved for the day
# a registry release is wanted, and because re-adding it later would mean
# rebuilding the OIDC wiring from scratch. It is manual only, and it has
# never been run.
#
# Two npm facts make the first release the awkward one, so they are written
# down rather than rediscovered:
#
#   * npm cannot pre-configure a trusted publisher for a package that does
#     not exist yet, so the FIRST release cannot use OIDC and has to be
#     published by hand. npm's own issue #1926 is still open.
#   * Every publish needs two-factor authentication, or a granular token
#     with "bypass 2FA" enabled. A token without that flag is refused with
#     403, and the registry does not send a challenge header, so an OTP
#     argument does not help.
#
# So a first release needs: two-factor authentication on the account (or a
# granular token with bypass 2FA), one manual publish, and then this
# workflow for every release after it.
#
# Setup on npmjs.com (one time), after the first manual release, in the
# package settings:
#   Trusted Publisher -> GitHub Actions
#     Organization or user : woaiCarlos
#     Repository           : dsh-minimax-quota
#     Workflow filename    : publish.yml
#
# Then publish by running this workflow, or by tagging:
#   git tag v1.2.0 && git push origin v1.2.0

on:
  # Manual only. The plugin is distributed from this Git repository, not from
  # npm; this workflow exists for the day you decide to publish a package
  # too. It is deliberately not tag-triggered: an automatic trigger would
  # fail on every release tag while the package is absent from the registry.
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in a release build

      - run: npm ci

      - name: Verify the package before publishing
        run: |
          node --check index.js
          node --check client.js
          node -e "
            const pkg = require('./package.json');
            if (!pkg.dsh?.bundle?.patch) throw new Error('package.json must declare dsh.bundle.patch');
            const client = require('fs').readFileSync('client.js', 'utf8');
            if (!client.includes(\"id: '\" + pkg.name + \"'\")) {
              throw new Error('client.js must register the module id equal to the package name');
            }
          "

      - name: Publish
        # No --provenance flag: with trusted publishing npm generates the
        # provenance attestation automatically for a public package from a
        # public repository.
        run: npm publish
