name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The plugin runs on whichever Node the user's Harness ships, and
          # the test runner's path handling changed between versions: the
          # suite is run on every supported line so that difference can
          # never reach a release unnoticed.
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        run: npm test

      - name: Validate JSON manifests
        run: |
          node -e "
            for (const f of ['package.json', 'dsh-plugin.json', 'locale/en.json', 'locale/zh.json']) {
              JSON.parse(require('fs').readFileSync(f, 'utf8'));
              console.log('ok', f);
            }
          "

      - name: Validate the bundle patch
        run: |
          node -e "
            const fs = require('fs');
            const text = fs.readFileSync('cordis.patch.yml', 'utf8');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!/^\s*-\s*insert:/m.test(text)) throw new Error('patch has no insert list');
            if (!text.includes(\"name: '\" + pkg.name + \"'\")) throw new Error('patch does not insert this package (' + pkg.name + ')');
            console.log('ok cordis.patch.yml');
          "

      - name: Guard against committed secrets
        run: |
          # No real MiniMax key may ever enter the repository, and the
          # READMEs are part of it: a key pasted into a README is a
          # committed value like any other, so they are scanned too.
          if git grep -nE "sk-[A-Za-z0-9_-]{16,}" -- .; then
            echo "::error::a credential-like value is committed to this repository"
            exit 1
          fi
          echo "ok no credentials found"

      - name: Check the client half registers its package name
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const client = fs.readFileSync('client.js', 'utf8');
            if (!client.includes(\"id: '\" + pkg.name + \"'\")) {
              throw new Error('client.js must register the module id equal to the package name (' + pkg.name + ')');
            }
            console.log('ok client module id');
          "
